name: Generate Profile SVGs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Bomberman Graph
        uses: Platane/snk@v3
        with:
          github_user_name: esthefany15
          outputs: |
            dist/bomberman-contribution-graph.svg?palette=github-light
            dist/bomberman-contribution-graph-dark.svg?palette=github-dark

      - name: Push Bomberman to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
